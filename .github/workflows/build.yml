name: Build debug APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: cloudplay-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish to "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk cloudplay-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest cloudplay-debug.apk \
            --title "CloudPlay debug build" \
            --notes "Debug APK built from ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"
